function sprite(map) {                                   // 글자 그림 → 캔버스 (한 번만 그림)
  if (SPR.has(map)) return SPR.get(map);
  const cv = document.createElement('canvas'); cv.width = map[0].length; cv.height = map.length;
  const g = cv.getContext('2d');
  map.forEach((row, y) => [...row].forEach((ch, x) => { if (PAL[ch]) { g.fillStyle = PAL[ch]; g.fillRect(x, y, 1, 1); } }));
  SPR.set(map, cv); return cv;

  ctx.fillStyle = '#ece6d6'; ctx.textAlign = 'center'; ctx.font = '12px Galmuri';
  ctx.globalAlpha = 0.5;
  if (W < 200) { ctx.fillText('흙으로 나를 인간으로', W / 2, 18); ctx.fillText('빚어달라고 제가 청했습니까.', W / 2, 32); ctx.fillText('창조주여.', W / 2, 46); }
  else { ctx.fillText('흙으로 나를 인간으로 빚어달라고', W / 2, 24); ctx.fillText('제가 청했습니까. 창조주여.', W / 2, 40); }
  ctx.globalAlpha = 1;
  ctx.font = '12px Galmuri';
  const narrow = W < 200;
  [['괴물로 걷기', narrow ? W / 2 : W / 2 - 52, narrow ? 112 : 114], ['빅토르로 걷기', narrow ? W / 2 : W / 2 + 52, narrow ? 130 : 114]].forEach(([txt, x, y], i) => {
    ctx.globalAlpha = sel === i ? 1 : 0.35; ctx.fillText(txt, x, y);
    if (sel === i) R(ctx, x - ctx.measureText(txt).width / 2, y + 4, ctx.measureText(txt).width, 1, '#ece6d6');
  });
  ctx.globalAlpha = 1; ctx.textAlign = 'left';
}

// 글자 하나씩 (상자)
function typeTick() {
  if (!box) return;
  const l = box.lines[box.i]; if (box.ch < l.length) box.ch += 0.6;
  sayEl.textContent = l.slice(0, Math.floor(box.ch));
}

const hintEl = document.getElementById('hint');
const logoEl = document.getElementById('logo');
function logoTick() {                                    // 타이틀: 첫 화면 창 / 시점 고르는 화면에서만
  logoEl.classList.toggle('on', !landing && !howto && scene < 0 && !intro);   // 시점 고르는 화면
  logoEl.style.top = 'calc(var(--ch) * .52)';
}
function hintTick() {                                    // 지금 할 일 한 줄 (상자 열렸을 땐 숨김)
  let h = '';
  if (ending === 5) h = '→ 꾹 누르면 빨리 · 스페이스로 건너뛰기';
  else if (scene >= 0 && !box && !ending) { const s = S(); h = failT ? (s.mech && s.mech.hint(M)) || '' : (s.mech && s.mech.hint(M)) || ''; }
  h = K(h);
  if (hintEl.textContent !== h) hintEl.textContent = h;
  hintEl.classList.toggle('on', !!h && !box);
  hintEl.classList.toggle('low', ending === 5);       // 크레딧 안내만 아래
}
(function loop() { update(); draw(); typeTick(); hintTick(); logoTick(); creditsTick(); requestAnimationFrame(loop); })();

const front = document.getElementById('front'), flow = document.getElementById('flow');
{ const N = window.NOVEL || '', i = N.indexOf('제1권편지 1'); flow.textContent = N.slice(i < 0 ? 0 : i).replace('제1권편지 1', '제1권 · 편지 1 — '); }
let flowY = 0, flowDrag = null;
function flowTick() {
  if (!landing) return;
  if (!flowDrag) flowY -= 0.4;
  const h = flow.offsetHeight; if (flowY < -h) flowY = innerHeight; if (flowY > innerHeight) flowY = -h + 1;
  flow.style.transform = `translate(-50%, ${flowY}px)`;
  requestAnimationFrame(flowTick);
}
front.addEventListener('pointerdown', e => { flowDrag = { y: e.clientY, at: flowY }; front.classList.add('drag'); front.setPointerCapture(e.pointerId); });
front.addEventListener('pointermove', e => { if (flowDrag) flowY = flowDrag.at + (e.clientY - flowDrag.y); });
['pointerup', 'pointercancel'].forEach(ev => front.addEventListener(ev, () => { flowDrag = null; front.classList.remove('drag'); }));
front.addEventListener('wheel', e => { flowY -= e.deltaY; }, { passive: true });
document.getElementById('start').addEventListener('click', e => { e.stopPropagation(); startGame(); });
